services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: frontiride
      POSTGRES_PASSWORD: frontiride
      POSTGRES_DB: frontiride
    ports:
      - "5432:5432"
    volumes:
      - frontiride_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontiride -d frontiride"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://frontiride:frontiride@postgres:5432/frontiride?schema=public
      JWT_SECRET: dev-secret-change-me
      APP_URL: http://localhost:3000
      FEDAPAY_ENV: sandbox
      FEDAPAY_SECRET_KEY: ${FEDAPAY_SECRET_KEY:-}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/prisma:/app/apps/backend/prisma

volumes:
  frontiride_postgres_data:
