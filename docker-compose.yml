# Démarrage local complet : base de données, API et back-office.
#
#   docker compose up --build
#
# L'application mobile n'est pas ici : Metro doit rester joignable depuis le
# téléphone, il tourne donc directement sur la machine (voir README).
#
# Les ports côté hôte sont configurables si l'un d'eux est déjà pris :
#   BACKEND_PORT=48001 ADMIN_PORT=48005 POSTGRES_PORT=48432 docker compose up

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: frontiride
      POSTGRES_PASSWORD: frontiride
      POSTGRES_DB: frontiride
    ports:
      - "${POSTGRES_PORT:-47432}:5432"
    volumes:
      - frontiride_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontiride -d frontiride"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://frontiride:frontiride@postgres:5432/frontiride?schema=public
      JWT_SECRET: dev-secret-change-me
      # Adresse vue depuis l'extérieur du conteneur : c'est elle que Fedapay
      # rappelle, donc le port publié et non le port interne.
      APP_URL: http://localhost:${BACKEND_PORT:-47001}
      # Vides par défaut : sans elles, l'appel dans l'application est
      # simplement masqué côté mobile.
      AGORA_APP_ID: ${AGORA_APP_ID:-}
      AGORA_APP_CERTIFICATE: ${AGORA_APP_CERTIFICATE:-}
      FEDAPAY_ENV: sandbox
      FEDAPAY_SECRET_KEY: ${FEDAPAY_SECRET_KEY:-}
      PORT: 47001
    ports:
      - "${BACKEND_PORT:-47001}:47001"
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/prisma:/app/apps/backend/prisma
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://localhost:47001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Lue par le navigateur, pas par le conteneur : c'est donc l'adresse
      # publiée sur la machine hôte, jamais le nom de service Docker.
      VITE_API_URL: http://localhost:${BACKEND_PORT:-47001}
    ports:
      - "${ADMIN_PORT:-47005}:47005"
    volumes:
      - ./apps/admin/src:/app/apps/admin/src
      - ./apps/admin/index.html:/app/apps/admin/index.html

volumes:
  frontiride_postgres_data:
