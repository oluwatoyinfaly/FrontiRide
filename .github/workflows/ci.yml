name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — types et tests de bout en bout
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frontiride
          POSTGRES_PASSWORD: frontiride
          POSTGRES_DB: frontiride
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U frontiride"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://frontiride:frontiride@localhost:5432/frontiride?schema=public
      JWT_SECRET: ci-secret
      APP_URL: http://localhost:47001
      # Valeurs factices : la fabrication d'un jeton Agora est purement locale,
      # elle n'appelle aucun service. Elles suffisent à tester le parcours.
      AGORA_APP_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AGORA_APP_CERTIFICATE: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run prisma:generate --workspace apps/backend
      - run: npx prisma migrate deploy
        working-directory: apps/backend
      - run: npm run build --workspace apps/backend

      - name: Seed et démarrage de l'API
        working-directory: apps/backend
        run: |
          npm run prisma:seed
          node dist/server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:47001/health && break
            sleep 1
          done

      - name: Tests de bout en bout
        working-directory: apps/backend
        run: API=http://localhost:47001 bash scripts/smoke.sh

  mobile:
    name: Mobile — types et traductions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/mobile
      - name: Clés de traduction
        run: npm run check:i18n --workspace apps/mobile

  admin:
    name: Admin — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace apps/admin
