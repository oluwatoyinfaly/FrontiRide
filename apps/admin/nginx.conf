server {
    listen 80;
    listen 47005;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Le back-office est une application à une page : toute adresse qui n'est pas
    # un fichier renvoie l'index, et le routeur du navigateur prend le relais
    # (rechargement sur /chauffeurs, lien direct…).
    # nginx n'hérite PAS des add_header du niveau supérieur dès qu'un bloc en
    # déclare un : les en-têtes de sécurité sont donc inclus dans chacun.
    location / {
        include /etc/nginx/security-headers.inc;
        try_files $uri /index.html;
    }

    # Les fichiers compilés portent leur empreinte dans leur nom : ils peuvent
    # être gardés longtemps. L'index, lui, ne doit jamais l'être, sinon un
    # redéploiement resterait invisible.
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store";
    }
}
